<!doctype html>

<head>
    <title>Storage Server Browser</title>
    <meta charset="UTF-8">
    <!-- Using https://caldwell.github.io/renderjson/ -->
    <script type="text/javascript" src="{{ url_for('static', filename='js/renderjson.js') }}"></script>
    <style>
      .renderjson a               { text-decoration: none; }
      .renderjson .disclosure     { color: crimson; font-size: 150%; }
      .renderjson .syntax         { color: grey; }
      .renderjson .string         { color: darkred; }
      .renderjson .number         { color: darkcyan; }
      .renderjson .boolean        { color: blueviolet; }
      .renderjson .key            { color: darkblue; }
      .renderjson .keyword        { color: blue; }
      .renderjson .object.syntax  { color: lightseagreen; }
      .renderjson .array.syntax   { color: orange; }
    </style>
</head>

<body>

<h2>Storage Server Browser &mdash; Browse Paths</h2>

<p>
  [ <a href='index.html'>Home</a>
  | <a href="search_assets.html">Search assets</a>
  | <a href="search_mmif.html">Search MMIF files</a>
  | <a href="browse_paths.html">Browse paths</a>
  | <a href="analytics.html">Storage analytics</a>
  ]
</p>

<p>{{' > '.join(path.parts)}}</p>

{% if header %}
<h4>{{header}}</h4>
{% endif %}

{% if content %}
<blockquote>
  <div id="mmif"></div>
</blockquote>
<script>
renderjson.set_show_to_level(1);
var mmif = {{content | safe}};
document.getElementById("mmif").appendChild(renderjson(mmif));
</script>
{% endif %}

</body>

</html>
