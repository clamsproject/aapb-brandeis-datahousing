<!doctype html>

<head>
    <title>Storage Server Browser</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/prism.css') }}">
</head>

<body>


<h2>Storage Server Browser &mdash; MMIF Files</h2>

<p>
  [ <a href='index.html'>Home</a>
  | <a href="search_assets.html">Search assets</a>
  | <a href="search_mmif.html">Search MMIF files</a>
  | <a href="browse_paths.html">Browse paths</a>
  | <a href="analytics.html">Storage analytics</a>
  ]
</p>

<h4>Search</h4>
<blockquote>
<form method=post>
    <table cellpadding="8" cellspacing="0" border="1">
        <tr>
            <td>GUID</td>
            <td><input type="text" name="guid" size="80" value='{{guid}}'></td>
        </tr>
        <tr valign="top">
            <td>Pipeline</td>
            <td>
                <textarea name="pipeline" rows="10" cols="80">{{pipeline}}</textarea>
            </td>
        </tr>
    </table>
    <p><input type="submit"></p>
</form>
</blockquote>


{% if result %}
<h4>{{result_header}}</h4>
<blockquote>
    <pre><code class="language-json">{{result}}</code></pre>
</blockquote>
{% endif %}

<script src="{{ url_for('static', filename='js/prism.js') }}"></script>

</body>

</html>
